name: ' Create Online Dev. Environment'

run-name: "Create Online Dev. Environment for [${{ github.ref_name }} / ${{ inputs.project }}]"

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project name if the repository is setup for multiple projects
        required: false
        default: '.'
      environmentName:
        description: Name of the online environment
        required: true
      reUseExistingEnvironment:
        description: Reuse environment if it exists?
        type: boolean
        default: false
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: false
  workflow_call:
    inputs:
      caller:
        description: Name of the calling workflow (use github.workflow as value when calling)
        type: string
        required: true
      project:
        description: Project name if the repository is setup for multiple projects
        type: string
        required: false
        default: '.'
      environmentName:
        description: Name of the online environment
        type: string
        required: true
      reUseExistingEnvironment:
        description: Reuse environment if it exists?
        type: boolean
        default: false
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

defaults:
  run:
    shell: pwsh

env:
  WorkflowEventName: ${{ inputs.caller && 'workflow_call' || github.event_name }}
  WorkflowName: ${{ inputs.caller && ' Create Online Dev. Environment' || github.workflow }}
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  Initialization:
    needs: [ ]
    runs-on: [ ubuntu-latest ]
    outputs:
      deviceCode: ${{ steps.authenticate.outputs.deviceCode }}
      githubRunner: ${{ steps.ReadSettings.outputs.GitHubRunnerJson }}
      githubRunnerShell: ${{ steps.ReadSettings.outputs.GitHubRunnerShell }}
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Dump Workflow Information
        uses: y0m0/AL-Go/Actions/DumpWorkflowInfo@feature/workflow_call
        with:
          shell: pwsh
          workflowEventName: ${{ env.WorkflowEventName }}
          inputsJson: ${{ toJson(inputs) }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize the workflow
        id: init
        uses: y0m0/AL-Go/Actions/WorkflowInitialize@feature/workflow_call
        with:
          shell: pwsh

      - name: Read settings
        id: ReadSettings
        uses: y0m0/AL-Go/Actions/ReadSettings@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}

      - name: Read secrets
        id: ReadSecrets
        uses: y0m0/AL-Go/Actions/ReadSecrets@feature/workflow_call
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'adminCenterApiCredentials'

      - name: Check AdminCenterApiCredentials / Initiate Device Login (open to see code)
        id: authenticate
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $settings = $env:Settings | ConvertFrom-Json
          if ('${{ fromJson(steps.ReadSecrets.outputs.Secrets).adminCenterApiCredentials }}') {
            Write-Host "AdminCenterApiCredentials provided in secret $($settings.adminCenterApiCredentialsSecretName)!"
            Add-Content -Encoding UTF8 -path $ENV:GITHUB_STEP_SUMMARY -value "Admin Center Api Credentials was provided in a secret called $($settings.adminCenterApiCredentialsSecretName). Using this information for authentication."
          }
          else {
            Write-Host "AdminCenterApiCredentials not provided, initiating Device Code flow"
            $ALGoHelperPath = "$([System.IO.Path]::GetTempFileName()).ps1"
            $webClient = New-Object System.Net.WebClient
            $webClient.DownloadFile('https://raw.githubusercontent.com/y0m0/AL-Go/feature/workflow_call/Actions/AL-Go-Helper.ps1', $ALGoHelperPath)
            . $ALGoHelperPath
            DownloadAndImportBcContainerHelper
            $authContext = New-BcAuthContext -includeDeviceLogin -deviceLoginTimeout ([TimeSpan]::FromSeconds(0))
            Add-Content -Encoding UTF8 -path $ENV:GITHUB_STEP_SUMMARY -value "AL-Go needs access to the Business Central Admin Center Api and could not locate a secret called $($settings.adminCenterApiCredentialsSecretName) (https://aka.ms/ALGoSettings#AdminCenterApiCredentialsSecretName)`n`n$($authContext.message)"
            Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -Value "deviceCode=$($authContext.deviceCode)"
          }

  CreateDevelopmentEnvironment:
    needs: [ Initialization ]
    runs-on: ${{ fromJson(needs.Initialization.outputs.githubRunner) }}
    defaults:
      run:
        shell: ${{ needs.Initialization.outputs.githubRunnerShell }}
    name: Create Development Environment
    env:
      deviceCode: ${{ needs.Initialization.outputs.deviceCode }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read settings
        uses: y0m0/AL-Go/Actions/ReadSettings@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}

      - name: Read secrets
        id: ReadSecrets
        uses: y0m0/AL-Go/Actions/ReadSecrets@feature/workflow_call
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'adminCenterApiCredentials,TokenForPush'
          useGhTokenWorkflowForPush: '${{ inputs.useGhTokenWorkflow }}'

      - name: Set AdminCenterApiCredentials
        id: SetAdminCenterApiCredentials
        run: |
          if ($env:deviceCode) {
            $adminCenterApiCredentials = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("{""deviceCode"":""$($env:deviceCode)""}"))
          }
          else {
            $adminCenterApiCredentials = '${{ fromJson(steps.ReadSecrets.outputs.Secrets).adminCenterApiCredentials }}'
          }
          Add-Content -Encoding UTF8 -Path $env:GITHUB_OUTPUT -value "adminCenterApiCredentials=$adminCenterApiCredentials"

      - name: Create Development Environment
        uses: y0m0/AL-Go/Actions/CreateDevelopmentEnvironment@feature/workflow_call
        with:
          shell: pwsh
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          environmentName: ${{ inputs.environmentName }}
          project: ${{ inputs.project }}
          reUseExistingEnvironment: ${{ inputs.reUseExistingEnvironment }}
          directCommit: ${{ inputs.directCommit }}
          adminCenterApiCredentials: ${{ steps.SetAdminCenterApiCredentials.outputs.adminCenterApiCredentials }}

      - name: Finalize the workflow
        if: always()
        uses: y0m0/AL-Go/Actions/WorkflowPostProcess@feature/workflow_call
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: pwsh
          telemetryScopeJson: ${{ needs.Initialization.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}
