name: ' Create release'
run-name: "Create release - Version ${{ inputs.tag }}"

concurrency:
  group: ${{ inputs.caller && ' Create release' || github.workflow }}

on:
  workflow_dispatch:
    inputs:
      buildVersion:
        description: Build version to promote to release (default is latest)
        required: false
        default: 'latest'
      name:
        description: Name of this release
        required: true
        default: ''
      tag:
        description: Tag of this release (needs to be semantic version string https://semver.org, ex. 1.0.0)
        required: true
        default: ''
      releaseType:
        description: Release, prerelease or draft?
        type: choice
        options:
          - Release
          - Prerelease
          - Draft
        default: 'Release'
      createReleaseBranch:
        description: Create Release Branch?
        type: boolean
        default: false
      releaseBranchPrefix:
        description: The prefix for the release branch. Used only if 'Create Release Branch?' is checked.
        type: string
        default: release/
      updateVersionNumber:
        description: New Version Number in main branch. Use Major.Minor (optionally add .Build for versioningstrategy 3) for absolute change, or +1, +0.1 (or +0.0.1 for versioningstrategy 3) incremental change.
        required: false
        default: '+0.0.1'
      skipUpdatingDependencies:
        description: Skip updating dependency version numbers in all apps.
        type: boolean
        default: false
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: true
  workflow_call:
    inputs:
      caller:
        description: Name of the calling workflow (use github.workflow as value when calling)
        type: string
        required: true
      buildVersion:
        description: Build version to promote to release (default is latest)
        type: string
        required: false
        default: 'latest'
      name:
        description: Name of this release
        type: string
        required: true
      tag:
        description: Tag of this release (needs to be semantic version string https://semver.org, ex. 1.0.0)
        type: string
        required: true
      releaseType:
        description: Release, prerelease or draft?
        type: string
        default: 'Release'
      createReleaseBranch:
        description: Create Release Branch?
        type: boolean
        default: false
      releaseBranchPrefix:
        description: The prefix for the release branch. Used only if 'Create Release Branch?' is checked.
        type: string
        default: release/
      updateVersionNumber:
        description: New Version Number in main branch. Use Major.Minor (optionally add .Build for versioningstrategy 3) for absolute change, or +1, +0.1 (or +0.0.1 for versioningstrategy 3) incremental change.
        type: string
        required: false
        default: '+0.0.1'
      skipUpdatingDependencies:
        description: Skip updating dependency version numbers in all apps.
        type: boolean
        default: false
      directCommit:
        description: Direct Commit?
        type: boolean
        default: false
      useGhTokenWorkflow:
        description: Use GhTokenWorkflow for PR/Commit?
        type: boolean
        default: true
    outputs:
      releaseId:
        description: The id of the created release
        value: ${{ jobs.CreateRelease.outputs.releaseId }}
      releaseVersion:
        description: The version of the created release
        value: ${{ jobs.CreateRelease.outputs.releaseVersion }}
      commitish:
        description: The commit the release was created from
        value: ${{ jobs.CreateRelease.outputs.commitish }}

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

defaults:
  run:
    shell: pwsh

env:
  WorkflowEventName: ${{ inputs.caller && 'workflow_call' || github.event_name }}
  WorkflowName: ${{ inputs.caller && ' Create release' || github.workflow }}
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  CheckForUpdates:
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read settings
        uses: y0m0/AL-Go/Actions/ReadSettings@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}
          get: templateUrl

      - name: Read secrets
        id: ReadSecrets
        uses: y0m0/AL-Go/Actions/ReadSecrets@feature/workflow_call
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'ghTokenWorkflow'

      - name: Check for updates to AL-Go system files
        uses: y0m0/AL-Go/Actions/CheckForUpdates@feature/workflow_call
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: pwsh
          templateUrl: ${{ env.templateUrl }}
          token: ${{ fromJson(steps.ReadSecrets.outputs.Secrets).ghTokenWorkflow }}
          downloadLatest: true

  CreateRelease:
    needs: [ ]
    runs-on: [ ubuntu-latest ]
    outputs:
      artifacts: ${{ steps.determineArtifactsForRelease.outputs.artifacts }}
      releaseId: ${{ steps.createrelease.outputs.releaseId }}
      commitish: ${{ steps.determineArtifactsForRelease.outputs.commitish }}
      releaseVersion: ${{ steps.createreleasenotes.outputs.releaseVersion }}
      telemetryScopeJson: ${{ steps.init.outputs.telemetryScopeJson }}
    steps:
      - name: Dump Workflow Information
        uses: y0m0/AL-Go/Actions/DumpWorkflowInfo@feature/workflow_call
        with:
          shell: pwsh
          workflowEventName: ${{ env.WorkflowEventName }}
          inputsJson: ${{ toJson(inputs) }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize the workflow
        id: init
        uses: y0m0/AL-Go/Actions/WorkflowInitialize@feature/workflow_call
        with:
          shell: pwsh

      - name: Read settings
        id: ReadSettings
        uses: y0m0/AL-Go/Actions/ReadSettings@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}
          get: repoName,type,powerPlatformSolutionFolder

      - name: Validate Workflow Input
        if: ${{ env.WorkflowEventName == 'workflow_dispatch' || env.WorkflowEventName == 'workflow_call' }}
        uses: y0m0/AL-Go/Actions/ValidateWorkflowInput@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}
          inputsJson: ${{ toJson(inputs) }}

      - name: Read secrets
        id: ReadSecrets
        uses: y0m0/AL-Go/Actions/ReadSecrets@feature/workflow_call
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush,ghTokenWorkflow'
          useGhTokenWorkflowForPush: '${{ inputs.useGhTokenWorkflow }}'

      - name: Determine Projects
        id: determineProjects
        uses: y0m0/AL-Go/Actions/DetermineProjectsToBuild@feature/workflow_call
        with:
          shell: pwsh
          workflowEventName: ${{ env.WorkflowEventName }}

      - name: Determine artifacts for release
        uses: y0m0/AL-Go/Actions/DetermineArtifactsForRelease@feature/workflow_call
        id: determineArtifactsForRelease
        with:
          shell: pwsh
          buildVersion: ${{ inputs.buildVersion }}
          GITHUB_TOKEN: ${{ github.token }}
          TOKENFORPUSH: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          ProjectsJson: ${{ steps.determineProjects.outputs.ProjectsJson }}

      - name: Prepare release notes
        id: createreleasenotes
        uses: y0m0/AL-Go/Actions/CreateReleaseNotes@feature/workflow_call
        with:
          shell: pwsh
          buildVersion: ${{ inputs.buildVersion }}
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.determineArtifactsForRelease.outputs.commitish }}

      - name: Create release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: createrelease
        env:
          bodyMD: ${{ steps.createreleasenotes.outputs.releaseNotes }}
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.name }}
          releaseType: ${{ inputs.releaseType }}
          prerelease: ${{ inputs.releaseType == 'Prerelease' }}
          commitish: ${{ steps.determineArtifactsForRelease.outputs.commitish }}
        with:
          github-token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          script: |
            var bodyMD = process.env.bodyMD
            const createReleaseResponse = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.tag_name,
              name: process.env.name,
              body: bodyMD.replaceAll('\\n','\n').replaceAll('%0A','\n').replaceAll('%0D','\n').replaceAll('%25','%'),
              draft: (process.env.releaseType == 'Draft'),
              prerelease: (process.env.releaseType == 'Prerelease'),
              make_latest: 'legacy',
              target_commitish: process.env.commitish
            });
            const {
              data: { id: releaseId, html_url: htmlUrl, upload_url: uploadUrl }
            } = createReleaseResponse;
            core.setOutput('releaseId', releaseId);

  UploadArtifacts:
    needs: [ CreateRelease ]
    runs-on: [ ubuntu-latest ]
    name: Upload ${{ matrix.name }}
    strategy:
      matrix: ${{ fromJson(needs.CreateRelease.outputs.artifacts) }}
      fail-fast: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read settings
        uses: y0m0/AL-Go/Actions/ReadSettings@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}

      - name: Read secrets
        id: ReadSecrets
        uses: y0m0/AL-Go/Actions/ReadSecrets@feature/workflow_call
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'nuGetContext,storageContext,TokenForPush'
          useGhTokenWorkflowForPush: '${{ inputs.useGhTokenWorkflow }}'

      - name: Download artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_URL: ${{ matrix.url }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          Write-Host "Downloading artifact $ENV:MATRIX_NAME"
          $headers = @{
            "Authorization" = "token $ENV:GITHUB_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
            "Accept" = "application/vnd.github+json"
          }
          Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $ENV:MATRIX_URL -OutFile "$($ENV:MATRIX_NAME).zip"

      - name: Upload release artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          releaseId: ${{ needs.createrelease.outputs.releaseId }}
          MATRIX_NAME: ${{ matrix.name }}
        with:
          github-token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          script: |
            const releaseId = process.env.releaseId
            const matrixName = process.env.MATRIX_NAME
            const assetPath = `${matrixName}.zip`
            const assetName = encodeURIComponent(`${matrixName}.zip`.replaceAll(' ','.')).replaceAll('%','')
            const fs = require('fs');
            const uploadAssetResponse = await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: assetName,
              data: fs.readFileSync(assetPath)
            });

      - name: Deliver to NuGet
        uses: y0m0/AL-Go/Actions/Deliver@feature/workflow_call
        if: ${{ matrix.atype == 'Apps' && fromJson(steps.ReadSecrets.outputs.Secrets).nuGetContext != '' }}
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: pwsh
          type: 'Release'
          projects: ${{ matrix.project }}
          deliveryTarget: 'NuGet'
          artifacts: ${{ inputs.buildVersion }}
          atypes: 'Apps,TestApps'

      - name: Deliver to Storage
        uses: y0m0/AL-Go/Actions/Deliver@feature/workflow_call
        if: ${{ matrix.atype == 'Apps' && fromJson(steps.ReadSecrets.outputs.Secrets).storageContext != '' }}
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: pwsh
          type: 'Release'
          projects: ${{ matrix.project }}
          deliveryTarget: 'Storage'
          artifacts: ${{ inputs.buildVersion }}
          atypes: 'Apps,TestApps,Dependencies'

  CreateReleaseBranch:
    needs: [ CreateRelease, UploadArtifacts ]
    if: ${{ inputs.createReleaseBranch }}
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: '${{ needs.createRelease.outputs.commitish }}'

      - name: Create Release Branch
        env:
          releaseBranchPrefix: ${{ inputs.releaseBranchPrefix }}
        run: |
          $errorActionPreference = "Stop"; $ProgressPreference = "SilentlyContinue"; Set-StrictMode -Version 2.0
          $releaseBranch = "$($env:releaseBranchPrefix)" + "${{ needs.CreateRelease.outputs.releaseVersion }}"
          Write-Host "Creating release branch $releaseBranch"
          git checkout -b $releaseBranch
          git config user.name ${{ github.actor}}
          git config user.email ${{ github.actor}}@users.noreply.github.com
          git commit --allow-empty -m "Release branch $releaseBranch"
          git push origin $releaseBranch

  UpdateVersionNumber:
    needs: [ CreateRelease, UploadArtifacts ]
    if: ${{ inputs.updateVersionNumber!='' }}
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read settings
        uses: y0m0/AL-Go/Actions/ReadSettings@feature/workflow_call
        with:
          shell: pwsh
          workflowName: ${{ env.WorkflowName }}

      - name: Read secrets
        id: ReadSecrets
        uses: y0m0/AL-Go/Actions/ReadSecrets@feature/workflow_call
        with:
          shell: pwsh
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'TokenForPush'
          useGhTokenWorkflowForPush: '${{ inputs.useGhTokenWorkflow }}'

      - name: Update Version Number
        uses: y0m0/AL-Go/Actions/IncrementVersionNumber@feature/workflow_call
        with:
          shell: pwsh
          token: ${{ steps.ReadSecrets.outputs.TokenForPush }}
          versionNumber: ${{ inputs.updateVersionNumber }}
          skipUpdatingDependencies: ${{ inputs.skipUpdatingDependencies }}
          directCommit: ${{ inputs.directCommit }}

  PostProcess:
    needs: [ CheckForUpdates, CreateRelease, UploadArtifacts, CreateReleaseBranch, UpdateVersionNumber ]
    if: always()
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Finalize the workflow
        id: PostProcess
        uses: y0m0/AL-Go/Actions/WorkflowPostProcess@feature/workflow_call
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          shell: pwsh
          telemetryScopeJson: ${{ needs.CreateRelease.outputs.telemetryScopeJson }}
          currentJobContext: ${{ toJson(job) }}
